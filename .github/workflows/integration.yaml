name: Integration Tests

on:
  pull_request:
    branches:
      - main

jobs:
  Test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.15-trixie

        env:
          POSTGRES_PASSWORD: masterbase
          POSTGRES_USER: MEGASCATTERBOMB
          POSTGRES_DB: demos

        ports:
          - 8050:5432

      minio:
        image: chainguard/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: MEGASCATTERBOMB
          MINIO_ROOT_PASSWORD: masterbase

    env:
      FORCE_COLOR: 1
      TERM: xterm-color
      MYPY_FORCE_COLOR: 1
      MYPY_FORCE_TERMINAL_WIDTH: 200
      PYTEST_ADDOPTS: --color=yes

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch mc client
        run: wget https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z -O mc && chmod +x mc
      - name: Create the buckets
        run: ./mc alias set blobs http://127.0.0.1:9000 MEGASCATTERBOMB masterbase
      - name: more minio bs
        run: ./mc mb -p blobs/rawblobs && ./mc mb -p blobs/demoblobs && ./mc mb -p blobs/jsonblobs
      - name: Remove mc client
        run: rm -v ./mc

      - name: Install PDM
        run: |
          python -m pip install --upgrade pip
          python -m pip install pdm

      - name: Install dependencies
        run: pdm sync -G:all

      - name: Run tests
        run: |
          pdm run alembic upgrade head
          pdm run pytest -m integration
        env:
          POSTGRES_PASSWORD: masterbase
          POSTGRES_USER: MEGASCATTERBOMB
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 8050
          MINIO_HOST: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: MEGASCATTERBOMB
          MINIO_SECRET_KEY: masterbase
          DEVELOPMENT: true
