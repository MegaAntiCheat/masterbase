version: '3.8'

services:
  minio:
    build:
      context: .
      dockerfile: ./services/minio/Dockerfile
    container_name: minio
    env_file:
      - vars.env
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: MEGASCATTERBOMB
      MINIO_ROOT_PASSWORD: masterbase
    volumes:
      - demo_data:/blobs/

  db:
    build:
      context: .
      dockerfile: ./services/db/Dockerfile
    container_name: db
    env_file:
      - vars.env
    environment:
      POSTGRES_DB: demos
    ports:
      - "8050:5432"
    volumes:
      - db_data:/var/lib/postgresql/data/

  api:
    build:
      context: .
      dockerfile: ./services/api/Dockerfile
      args:
        DEVELOPMENT: ${DEVELOPMENT}
    container_name: api
    env_file:
      - vars.env
    environment:
      POSTGRES_HOST: db
      MINIO_HOST: minio
    ports:
      - "8000:8000"
    depends_on:
      - minio


networks:
  masterbase_default:
    driver: bridge

volumes:
  demo_data:
  db_data: